<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
      .title { font-weight: 700; font-size: 28px; letter-spacing: -0.03em; fill: #ededed; }
      .sub { font-size: 14px; fill: #888888; }
      .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
      .code { font-size: 13px; line-height: 1.6; }
      .red { fill: #f87171; }
      .green { fill: #34d399; }
      .blue { fill: #38bdf8; }
      .dim { fill: #52525b; }
      .text-light { fill: #e4e4e7; }
      .amber { fill: #fbbf24; }
    </style>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1200" height="480" fill="#000000"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="1160" height="440" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1"/>

  <!-- Header Bar -->
  <line x1="20" y1="76" x2="1180" y2="76" stroke="#27272a" stroke-width="1"/>

  <!-- Left Header: Project Identity -->
  <g transform="translate(44, 48)">
    <rect x="0" y="-14" width="22" height="22" rx="4" fill="#10b981"/>
    <circle cx="11" cy="-3" r="5" fill="#000000"/>
    <path d="M 6 -3 L 16 -3 M 11 -8 L 11 2" stroke="#ffffff" stroke-width="1.5"/>
    <text x="32" y="3" class="mono text-light" font-size="14" font-weight="600">dali-short-address-commissioner</text>
    <text x="290" y="3" class="mono dim" font-size="14">/ IEC 62386</text>
  </g>

  <!-- Right Header: Status Telemetry -->
  <g transform="translate(1156, 48)">
    <text x="0" y="2" text-anchor="end" class="mono label dim">BUS POWER: <tspan fill="#34d399">16.2V DC (84mA / 250mA CAPACITY)</tspan></text>
  </g>

  <!-- Split View Dividers -->
  <line x1="600" y1="76" x2="600" y2="416" stroke="#27272a" stroke-width="1"/>
  <line x1="20" y1="416" x2="1180" y2="416" stroke="#27272a" stroke-width="1"/>

  <!-- LEFT PANE: Naive Misconfiguration (Rejected) -->
  <g transform="translate(44, 108)">
    <text x="0" y="0" class="mono label red">NAIVE APPROACH: SINGLE-SHOT &amp; ADDR CLASH (REJECTED)</text>
    
    <g transform="translate(0, 32)" class="mono code">
      <text y="0" class="dim">01 <tspan class="red"># Single-shot command (ignored by ballasts)</tspan></text>
      <text y="24" class="dim">02 <tspan class="red">send_cmd(0xA5, 0x00)  # Fails: requires &lt;100ms repeat</tspan></text>
      <text y="48" class="dim">03 <tspan class="red">for addr in range(1, 100):  # Invalid: max is 64 (0-63)</tspan></text>
      <text y="72" class="dim">04 <tspan class="red">    assign_short_address(addr)</tspan></text>
      <text y="96" class="dim">05 <tspan class="dim"># Ghost address overwrite: destroys existing 63 fixtures</tspan></text>
      <text y="120" class="dim">06 <tspan class="red">init_all_gear()  # Erased operational floor config</tspan></text>
      <text y="144" class="dim">07 <tspan class="red"># Missing WITHDRAW: binary search loops forever</tspan></text>
      <text y="168" class="dim">08 <tspan class="red">trigger_emergency_test(all_fixtures)  # Full darkness hazard</tspan></text>
    </g>

    <g transform="translate(0, 240)">
      <rect width="510" height="42" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
      <text x="14" y="25" class="mono red" font-size="12">&#x2717; Single-shot ignored | &gt;64 addresses | Blackout test risk</text>
    </g>
  </g>

  <!-- RIGHT PANE: Production Deterministic Commissioning (Verified) -->
  <g transform="translate(640, 108)">
    <text x="0" y="0" class="mono label green">PRODUCTION: 24-BIT BINARY SEARCH &amp; DOUBLE-CMD</text>
    
    <g transform="translate(0, 32)" class="mono code">
      <text y="0" class="dim">01 <tspan class="blue">send_double_cmd</tspan>(INITIALISE, repeat_ms=15)  <tspan class="green"># &lt;100ms</tspan></text>
      <text y="24" class="dim">02 <tspan class="blue">send_double_cmd</tspan>(RANDOMISE, repeat_ms=15)   <tspan class="green"># 24-bit space</tspan></text>
      <text y="48" class="dim">03 <tspan class="blue">while</tspan> unassigned_gear_present():</text>
      <text y="72" class="dim">04     random_addr = binary_search_24bit(low, high)</text>
      <text y="96" class="dim">05     <tspan class="green">send_double_cmd(PROGRAM_SHORT_ADDR, (slot&lt;&lt;1)|1)</tspan></text>
      <text y="120" class="dim">06     <tspan class="green">send_cmd(WITHDRAW)  # Isolates device from search</tspan></text>
      <text y="144" class="dim">07 <tspan class="amber">send_cmd(TERMINATE)  # Locks 15-min watchdog window</tspan></text>
      <text y="168" class="dim">08 physical_identify_pulse(slot)  <tspan class="green"># Visual human verification</tspan></text>
    </g>

    <g transform="translate(0, 240)">
      <rect width="510" height="42" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="14" y="25" class="mono green" font-size="12">&#x2713; IEC 62386 strict | 0-63 address bounds | Staggered tests</text>
    </g>
  </g>

  <!-- Footer Telemetry -->
  <g transform="translate(44, 442)">
    <text class="mono dim" font-size="12">STANDARD: <tspan class="text-light">IEC 62386 (Parts 101, 102, 202, 209)</tspan></text>
    <text x="380" class="mono dim" font-size="12">CAPACITY: <tspan class="green">64 ADDR / 16 GROUPS / 16 SCENES</tspan></text>
    <text x="750" class="mono dim" font-size="12">DT8: <tspan class="text-light">Tunable White, RGBWAF, xy-Coords</tspan></text>
    <text x="1112" text-anchor="end" class="mono green" font-size="12">&#x25CF; DETERMINISTIC</text>
  </g>
</svg>
